name: probe xcode
on: workflow_dispatch
jobs:
  list:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-27, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*
          for x in /Applications/Xcode*.app; do echo "$x"; ls "$x/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/" 2>/dev/null; done
