name: iOS unsigned ipa
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      WRK_SIDELOAD: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build (no code signing)
        run: |
          set -o pipefail
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 400
      - name: Package ipa
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          cd out && zip -qry wrk-unsigned.ipa Payload && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: wrk-unsigned-ipa
          path: out/wrk-unsigned.ipa
